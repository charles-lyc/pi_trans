<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiTrans 实时翻译</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2129; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #181b21; --text: #e6e8eb; --muted: #8b93a1;
      --line: #2a2f38; --accent: #60a5fa; --ok: #22c55e; --warn: #f59e0b; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 17px; margin: 0 auto 0 0; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.listening { background: var(--ok); animation: pulse 1.6s infinite; }
  .dot.paused, .dot.connecting { background: var(--warn); }
  .dot.no-mic, .dot.offline, .dot.cloud-error { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  #statusText { font-size: 12px; font-weight: normal; color: var(--muted); }
  select, button {
    font: inherit; font-size: 14px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .ic {
    width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  button:hover, select:hover { border-color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 16px; scroll-behavior: smooth; }
  .list { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .item {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; animation: fadein .25s ease-out;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
  .src { color: var(--muted); font-size: 16px; line-height: 1.5; }
  .dst { font-size: 22px; line-height: 1.5; margin-top: 4px; font-weight: 500; }
  .dst.pending { color: var(--muted); font-weight: normal; font-size: 16px; }
  .dst.error { color: var(--err); font-size: 14px; font-weight: normal; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .partial { border-style: dashed; }
  .partial .src { color: var(--text); font-size: 20px; }
  .partial .dst:empty { display: none; }
  .empty { text-align: center; color: var(--muted); margin-top: 20vh; }
  #stats {
    display: none; padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); overflow-x: auto;
  }
  #stats.open { display: block; }
  #stats table { border-collapse: collapse; font-size: 13px; width: 100%; max-width: 900px; margin: 0 auto; }
  #stats th, #stats td { padding: 4px 8px; text-align: right; white-space: nowrap; }
  #stats th:first-child, #stats td:first-child { text-align: left; }
  #stats th { color: var(--muted); font-weight: normal; border-bottom: 1px solid var(--line); }
  #stats td.err { color: var(--err); text-align: left; white-space: normal; min-width: 160px; }
  #stats tr.off td { color: var(--muted); }
  #stats .since { font-size: 11px; color: var(--muted); max-width: 900px; margin: 6px auto 0; }
  footer { height: 48px; background: var(--panel); border-top: 1px solid var(--line); }
  #wave { display: block; width: 100%; height: 100%; transition: opacity .3s; }
  #wave.idle { opacity: .3; }
  #jump {
    position: fixed; right: 16px; bottom: 64px; display: none;
    background: var(--accent); color: #fff; border: none; border-radius: 20px; padding: 8px 14px;
  }
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-7"/></symbol>
</svg>
<header>
  <h1><span class="dot" id="dot"></span>PiTrans <span id="statusText">连接中…</span></h1>
  <select id="direction" title="翻译方向">
    <option value="zh2en">中文 → English</option>
    <option value="en2zh">English → 中文</option>
    <option value="auto">自动识别</option>
  </select>
  <select id="engine" title="翻译引擎"></select>
  <button id="pause"><svg class="ic"><use href="#i-pause"/></svg><span>暂停</span></button>
  <button id="clear"><svg class="ic"><use href="#i-clear"/></svg>清空</button>
  <button id="statsBtn"><svg class="ic"><use href="#i-stats"/></svg>统计</button>
</header>
<section id="stats"></section>
<main id="main">
  <div class="list" id="list"></div>
  <div class="empty" id="empty">对着麦克风说话，识别和翻译结果会在这里滚动显示</div>
</main>
<footer><canvas id="wave"></canvas></footer>
<button id="jump">↓ 回到最新</button>
<script>
const $ = (id) => document.getElementById(id);
const main = $("main"), list = $("list");
const STATUS = { listening: "正在聆听", paused: "已暂停", "no-mic": "未检测到麦克风",
                 starting: "启动中", offline: "连接断开，重连中…",
                 connecting: "正在连接云端…", "cloud-error": "云端连接失败，重试中…" };
let ws, paused = false, stick = true, partialEl = null;

function setStatus(s) {
  $("dot").className = "dot " + s;
  $("wave").classList.toggle("idle", s !== "listening");
  $("statusText").textContent = STATUS[s] || s;
}

function fmtTime(ts) {
  return new Date(ts * 1000).toLocaleTimeString("zh-CN", { hour12: false });
}

function render(entry) {
  let el = document.querySelector(`[data-id="${entry.id}"]`);
  if (!el) {
    el = document.createElement("div");
    el.className = "item";
    el.dataset.id = entry.id;
    el.innerHTML = '<div class="src"></div><div class="dst"></div><div class="meta"></div>';
    list.insertBefore(el, partialEl);
  }
  el.querySelector(".src").textContent = entry.text;
  const dst = el.querySelector(".dst");
  if (entry.translation) {
    dst.className = "dst"; dst.textContent = entry.translation;
  } else if (entry.error) {
    dst.className = "dst error"; dst.textContent = "翻译失败：" + entry.error;
  } else {
    dst.className = "dst pending"; dst.textContent = "翻译中…";
  }
  const engine = entry.engine ? " · " + entry.engine : "";
  el.querySelector(".meta").textContent = fmtTime(entry.ts) + engine;
  $("empty").style.display = "none";
}

function setPartial(text, translation) {
  if (!text) { partialEl?.remove(); partialEl = null; return; }
  if (!partialEl) {
    partialEl = document.createElement("div");
    partialEl.className = "item partial";
    partialEl.innerHTML = '<div class="src"></div><div class="dst"></div>';
    list.appendChild(partialEl);
  }
  partialEl.querySelector(".src").textContent = text + " …";
  partialEl.querySelector(".dst").textContent = translation || "";
  $("empty").style.display = "none";
}

function applyConfig(c) {
  $("direction").value = c.direction;
  $("engine").innerHTML = c.engines.map((e) =>
    `<option value="${e.name}" ${e.available ? "" : "disabled"}>${e.label}${e.live ? " 👍" : ""}${e.available ? "" : "（未配置）"}</option>`
  ).join("");
  $("engine").value = c.engine;
  paused = c.paused;
  $("pause").querySelector("use").setAttribute("href", paused ? "#i-play" : "#i-pause");
  $("pause").querySelector("span").textContent = paused ? "继续" : "暂停";
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function renderStats(st) {
  const num = (v) => (v === null || v === undefined ? "—" : v.toLocaleString());
  const rows = st.engines.map((e) => `
    <tr class="${e.available ? "" : "off"}">
      <td>${esc(e.label)}${e.available ? "" : "（未配置）"}</td>
      <td>${e.ok}</td><td>${e.fail}</td>
      <td>${e.avg === null ? "—" : e.avg + "s"}</td>
      <td>${num(e.tokens_in)}</td><td>${num(e.tokens_out)}</td>
      <td class="err">${esc(e.last_error)}</td>
    </tr>`).join("");
  $("stats").innerHTML = `
    <table>
      <tr><th>引擎</th><th>成功</th><th>失败</th><th>平均耗时</th><th>输入 token</th><th>输出 token</th><th>最近错误</th></tr>
      ${rows}
    </table>
    <div class="since">统计自服务启动：${new Date(st.since * 1000).toLocaleString("zh-CN", { hour12: false })}（重启后清零）</div>`;
}


function scrollDown() {
  if (stick) main.scrollTop = main.scrollHeight;
}

main.addEventListener("scroll", () => {
  stick = main.scrollHeight - main.scrollTop - main.clientHeight < 80;
  $("jump").style.display = stick ? "none" : "block";
});
$("jump").onclick = () => { stick = true; scrollDown(); };

// 音频波形：服务端每 100ms 推 8 个峰值，这里按 80 根/秒匀速滚动画出来
const wave = $("wave"), wctx = wave.getContext("2d");
const BAR = 3, BAR_RATE = 80;
let bars = [], pending = [], lastFrame = 0, waveColor = "";

function sizeWave() {
  const dpr = window.devicePixelRatio || 1;
  wave.width = wave.clientWidth * dpr; wave.height = wave.clientHeight * dpr;
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  waveColor = getComputedStyle(document.body).getPropertyValue("--accent");
}

function drawWave(t) {
  const due = Math.floor((t - lastFrame) * BAR_RATE / 1000);
  if (due > 0) {
    lastFrame = t;
    if (pending.length > BAR_RATE / 2) pending.splice(0, pending.length - BAR_RATE / 4);  // 网络卡顿后追上
    bars.push(...pending.splice(0, due));
    const max = Math.ceil(wave.clientWidth / BAR);
    if (bars.length > max) bars.splice(0, bars.length - max);
    const w = wave.clientWidth, h = wave.clientHeight, mid = h / 2;
    wctx.clearRect(0, 0, w, h);
    wctx.fillStyle = waveColor;
    bars.forEach((p, i) => {
      const bh = Math.max(1, Math.sqrt(p) * (h - 8));  // 开方让小声也看得见
      wctx.fillRect(w - (bars.length - i) * BAR, mid - bh / 2, BAR - 1, bh);
    });
  }
  requestAnimationFrame(drawWave);
}
sizeWave();
window.addEventListener("resize", sizeWave);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", sizeWave);
requestAnimationFrame(drawWave);

const send = (msg) => ws?.readyState === 1 && ws.send(JSON.stringify(msg));
$("direction").onchange = (e) => send({ type: "set", direction: e.target.value });
$("engine").onchange = (e) => send({ type: "set", engine: e.target.value });
$("pause").onclick = () => send({ type: "set", paused: !paused });
$("clear").onclick = () => send({ type: "clear" });
$("statsBtn").onclick = () => $("stats").classList.toggle("open");

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "level") { pending.push(...m.peaks); return; }
    if (m.type === "init") {
      list.innerHTML = ""; partialEl = null;
      $("empty").style.display = m.history.length ? "none" : "block";
      m.history.forEach(render);
      setPartial(m.partial, m.partial_translation);
      applyConfig(m.config);
      setStatus(m.status);
      renderStats(m.stats);
    } else if (m.type === "stats") renderStats(m.stats);
    else if (m.type === "partial") setPartial(m.text, m.translation);
    else if (m.type === "final") { setPartial(""); render(m.entry); }
    else if (m.type === "update") render(m.entry);
    else if (m.type === "config") applyConfig(m.config);
    else if (m.type === "status") setStatus(m.status);
    else if (m.type === "clear") { list.innerHTML = ""; partialEl = null; $("empty").style.display = "block"; }
    scrollDown();
  };
  ws.onclose = () => { setStatus("offline"); setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
